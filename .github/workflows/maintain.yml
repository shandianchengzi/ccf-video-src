name: Build, crawl and deploy CCF source

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 19 * * *' # 03:23 China Standard Time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccf-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test catalog and publication boundaries
        run: python -m unittest discover -s tests -v
      - name: Test Android source contracts on JVM
        run: bash scripts/test-java.sh
      - name: Install Android compile tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build native CatVod dex JAR
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccf-jar
          path: build/ccf.jar
          retention-days: 14
          if-no-files-found: error

  catalog:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ccf-jar
          path: build
      - name: Fetch previous public catalog for regression guard
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          base="https://${REPOSITORY%%/*}.github.io/${REPOSITORY#*/}"
          if ! curl --fail --silent --show-error --retry 2 --max-time 45 "$base/catalog.json" -o build/previous.json; then
            rm -f build/previous.json
          fi
      - name: Crawl public metadata and original series membership
        run: python scripts/catalog.py --previous build/previous.json
      - name: Stage public subscription and browse page
        env:
          REPOSITORY: ${{ github.repository }}
        run: python scripts/package_site.py --base-url "https://${REPOSITORY%%/*}.github.io/${REPOSITORY#*/}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccf-pages-package
          path: dist
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages is enabled for GitHub Actions
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
